<!DOCTYPE html>
<html>
<head>
    <title>Silver Ice Helsinki</title>
</head>
<body>

    <h1>Silver Ice Helsinki</h1>

    <h2>Figure Skating Studio</h2>
{% if user.is_authenticated %}
    <h1>Welcome, {{ user.username }}!</h1>
    <p>You are logged in.</p>

{% else %}
    <h1>Welcome to Silver Ice Helsinki</h1>
    <p>Please log in or create an account.</p>

    <p>
        <a href="{% url 'studio:register' %}">Create an account</a>
    </p>

    <p>
        <a href="{% url 'studio:login' %}">Log in</a>
    </p>

{% endif %}
    <p>
    <a href="{% url 'studio:trainings' %}">View Trainings</a>
    </p>
</body>
</html>
