<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}
        <!--.as_p means Take the form object I passed from the view and render all of its fields as HTML paragraphs -->

        <button type="submit">Log in</button>
    </form>

</body>
</html>
