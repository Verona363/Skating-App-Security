<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    {% if rate_limited %}
        <p>Too many failed login attempts. Please try again later.</p>
    {% elif login_error %}
        <p>Invalid username or password.</p>
    {% endif %}

    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Log in</button>
    </form>

</body>
</html>
